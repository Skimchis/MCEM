<script>
const SIM = JSON.parse(document.getElementById('simdata').textContent);
const { N, t_max, frame_times, window: WIN, presets } = SIM;

const sel = document.getElementById('presetSelect');
presets.forEach((p, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = p.label;
  sel.appendChild(opt);
});

const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const cell = 4;
canvas.width = WIN * 2 * cell;
canvas.height = 40;
const colours = { 0: '#e2e2e2', 1: '#2b6cb0', 2: '#c53030' };

let presetIdx = 0;
let frameIdx = 0;
let playing = false;
let timer = null;

function current() { return presets[presetIdx]; }

function drawFrame(f) {
  const p = current();
  const arr = p.frames[f];
  for (let i = 0; i < arr.length; i++) {
    ctx.fillStyle = colours[arr[i]];
    ctx.fillRect(i * cell, 0, cell, canvas.height);
  }
  document.getElementById('timeLabel').textContent = `t = ${frame_times[f].toFixed(2)}   gap = ${p.gaps[f]}`;
  document.getElementById('scrub').value = f;
}

function setScrubMax() {
  document.getElementById('scrub').max = current().frames.length - 1;
}

let frontChart = new Chart(document.getElementById('frontChart'), {
  type: 'line',
  data: {
    labels: frame_times.map(t => t.toFixed(0)),
    datasets: [
      {
        label: 'blue front (X_t, rightmost blue)',
        data: current().rb,
        borderColor: '#2b6cb0',
        backgroundColor: 'rgba(43,108,176,0.08)',
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.1,
      },
      {
        label: 'red front (Y_t, leftmost red)',
        data: current().lr,
        borderColor: '#c53030',
        backgroundColor: 'rgba(197,48,48,0.08)',
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.1,
      }
    ]
  },
  options: {
    responsive: true,
    animation: false,
    scales: {
      x: { title: { display: true, text: 't' }, ticks: { maxTicksLimit: 8 } },
      y: { title: { display: true, text: 'site position' } }
    },
    plugins: { legend: { display: true, position: 'bottom' }, title: { display: true, text: 'Front positions over time, this run' } }
  }
});

let gapChart = new Chart(document.getElementById('gapChart'), {
  type: 'line',
  data: {
    labels: frame_times.map(t => t.toFixed(0)),
    datasets: [{
      label: 'gap size',
      data: current().gaps,
      borderColor: '#2b6cb0',
      backgroundColor: 'rgba(43,108,176,0.1)',
      pointRadius: 0,
      borderWidth: 2,
      tension: 0.1,
    }]
  },
  options: {
    responsive: true,
    animation: false,
    scales: {
      x: { title: { display: true, text: 't' }, ticks: { maxTicksLimit: 8 } },
      y: { title: { display: true, text: 'W_t (gap)' }, beginAtZero: true }
    },
    plugins: { legend: { display: false }, title: { display: true, text: 'Gap over time, this run' } }
  }
});

const gapMarkerPlugin = {
  id: 'gapMarker',
  afterDraw(chart) {
    const xScale = chart.scales.x;
    const yScale = chart.scales.y;
    const x = xScale.getPixelForValue(frameIdx);
    const c2 = chart.ctx;
    c2.save();
    c2.strokeStyle = '#c53030';
    c2.lineWidth = 1.5;
    c2.beginPath();
    c2.moveTo(x, yScale.top);
    c2.lineTo(x, yScale.bottom);
    c2.stroke();
    c2.restore();
  }
};
Chart.register(gapMarkerPlugin);

function buildHistBins(values, nbins) {
  const min = Math.min(...values), max = Math.max(...values);
  const w = Math.max(1, Math.ceil((max - min + 1) / nbins));
  const bins = {};
  values.forEach(v => {
    const b = Math.floor((v - min) / w) * w + min;
    bins[b] = (bins[b] || 0) + 1;
  });
  const keys = Object.keys(bins).map(Number).sort((a,b)=>a-b);
  return { labels: keys.map(k => `${k}-${k+w-1}`), counts: keys.map(k => bins[k]), edges: keys, width: w };
}

let histChart = new Chart(document.getElementById('histChart'), {
  type: 'bar',
  data: { labels: [], datasets: [{ label: '', data: [], backgroundColor: '#a0aec0' }] },
  options: {
    responsive: true,
    animation: false,
    scales: {
      x: { title: { display: true, text: 'gap size at t_max' }, ticks: { maxTicksLimit: 10 } },
      y: { title: { display: true, text: 'count' }, beginAtZero: true }
    },
    plugins: { legend: { display: false }, title: { display: true, text: '' } }
  }
});

function updateHistogram() {
  const p = current();
  const info = buildHistBins(p.hist_gaps, 20);
  const finalGap = p.gaps[p.gaps.length - 1];
  let markIdx = info.edges.length - 1;
  for (let i = 0; i < info.edges.length; i++) {
    if (finalGap >= info.edges[i] && finalGap < info.edges[i] + info.width) { markIdx = i; break; }
  }
  histChart.data.labels = info.labels;
  histChart.data.datasets[0].data = info.counts;
  histChart.data.datasets[0].label = `final gap distribution (n=${p.hist_gaps.length})`;
  histChart.data.datasets[0].backgroundColor = info.counts.map((_, i) => i === markIdx ? '#c53030' : '#a0aec0');
  histChart.options.plugins.title.text = `Final gap across ${p.hist_gaps.length} independent trials (q1=${p.q1}, q2=${p.q2})`;
  histChart.update();
}

function loadPreset(i) {
  presetIdx = i;
  frameIdx = 0;
  sel.value = i;
  setScrubMax();
  drawFrame(0);
  gapChart.data.datasets[0].data = current().gaps;
  gapChart.update();
  frontChart.data.datasets[0].data = current().rb;
  frontChart.data.datasets[1].data = current().lr;
  frontChart.update();
  updateHistogram();
  document.getElementById('metaLine').textContent =
    `N=${N} sites, t_max=${t_max}, q1=${current().q1}, q2=${current().q2}. One run shown, plus ${current().hist_gaps.length} independent trials in the histogram.`;
}

function step() {
  frameIdx++;
  if (frameIdx >= current().frames.length) {
    frameIdx = current().frames.length - 1;
    pause();
    return;
  }
  drawFrame(frameIdx);
  gapChart.update('none');
}

function play() {
  if (playing) return;
  if (frameIdx >= current().frames.length - 1) frameIdx = 0;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  timer = setInterval(step, 220);
}
function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  clearInterval(timer);
}

document.getElementById('playBtn').addEventListener('click', () => playing ? pause() : play());
sel.addEventListener('change', (e) => { pause(); loadPreset(parseInt(e.target.value, 10)); });
document.getElementById('scrub').addEventListener('input', (e) => {
  pause();
  frameIdx = parseInt(e.target.value, 10);
  drawFrame(frameIdx);
  gapChart.update('none');
});

let recorder = null;
let chunks = [];
document.getElementById('recordBtn').addEventListener('click', () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  if (!canvas.captureStream) {
    document.getElementById('recStatus').textContent = 'Recording not supported in this browser.';
    return;
  }
  const stream = canvas.captureStream(30);
  try {
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  } catch (e) {
    document.getElementById('recStatus').textContent = 'MediaRecorder unavailable.';
    return;
  }
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mcem_q1_${current().q1}_q2_${current().q2}.webm`;
    a.click();
    document.getElementById('recStatus').textContent = 'Downloaded .webm — convert to .gif with ezgif.com or ffmpeg.';
    document.getElementById('recordBtn').textContent = 'Record video';
  };
  frameIdx = 0;
  drawFrame(0);
  recorder.start();
  document.getElementById('recordBtn').textContent = 'Stop recording';
  document.getElementById('recStatus').textContent = 'Recording...';
  play();
  const checkDone = setInterval(() => {
    if (!playing) {
      clearInterval(checkDone);
      if (recorder.state === 'recording') recorder.stop();
    }
  }, 100);
});

loadPreset(0);
</script>
